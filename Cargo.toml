[package]
name = "wayvern"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
jod-thread = "1.0.0"
log = "0.4.27"
profiling = "1.0.16"
serde_json = "1.0.132"
smithay = { version = "0.7.0", features = ["wayland_frontend", "backend_egl", "use_system_lib"]}
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[build-dependencies]
bindgen = "0.72.0"
flate2 = "1.1.2"
hex = "0.4.3"
reqwest = { version = "0.12.22", features = ["blocking"] }
sha2 = "0.10.9"
tar = "0.4.44"

